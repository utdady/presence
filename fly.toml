# Presence — fly.io
# Setup:
#   fly auth login
#   fly apps create presence-YOURNAME   # pick a free unique name
#   fly secrets set JWT_SECRET="$(openssl rand -hex 32)"
#   fly deploy
#
# Optional (better call connectivity — TURN relay via Metered / Open Relay):
#   dashboard.metered.ca → TURN Server → Add Credential, then:
#   fly secrets set TURN_APP_NAME="yourapp" TURN_API_KEY="..."
#   (TURN_APP_NAME is the subdomain of yourapp.metered.live)
#
# Then open https://presence-YOURNAME.fly.dev

app = 'presence-addy'
primary_region = 'sin'

[build]

[env]
  APP_ENV = 'prod'
  # Web is served same-origin; the extra origins are the Tauri desktop webview.
  CORS_ORIGINS = 'https://presence-addy.fly.dev,http://tauri.localhost,https://tauri.localhost,tauri://localhost'
  STATIC_DIR = '/app/frontend/dist'
  USERS_FILE = '/data/users.json'
  INVITES_FILE = '/data/invites.json'

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one machine warm — scale-to-zero made first loads take 15–60s+.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[mounts]]
  source = 'presence_data'
  destination = '/data'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
