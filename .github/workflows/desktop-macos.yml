name: Build desktop macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> frontend/src-tauri/target

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build universal .app
        working-directory: frontend
        # .app first so we can ad-hoc sign before packing the DMG.
        run: npx tauri build --target universal-apple-darwin --bundles app

      - name: Ad-hoc codesign + DMG
        run: |
          set -euo pipefail
          APP=$(find frontend/src-tauri/target -path '*/bundle/macos/*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "No .app bundle found"
            find frontend/src-tauri/target -type d -name bundle || true
            exit 1
          fi
          echo "Signing $APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP" || true

          mkdir -p releases
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          hdiutil create \
            -volname "Presence" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            "releases/Presence-macos-universal.dmg"
          ls -lh releases/
          rm -rf "$STAGE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: presence-macos-dmg
          path: releases/Presence-macos-universal.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-macos-${{ github.sha }}
          name: Presence Desktop macOS · Beta 0.${{ github.run_number }}
          body: |
            **Presence · Desktop (macOS)** · Beta 0.${{ github.run_number }}
            Universal binary (Apple Silicon + Intel). Includes camera/mic permissions for calls.

            ## Install
            1. Download **Presence-macos-universal.dmg**
            2. Open the DMG → drag **Presence** into **Applications**
            3. Eject the DMG

            ## First launch (Gatekeeper)
            This build is **ad-hoc signed** (not Apple notarized). A normal double-click may fail.

            ### Option A — Finder
            1. Open **Applications**
            2. **Control-click** (right-click) **Presence** → **Open**
            3. Click **Open** again

            ### Option B — Terminal (copy & paste)
            Open **Terminal**, paste both lines, press Return:

            ```bash
            xattr -cr /Applications/Presence.app
            open /Applications/Presence.app
            ```

            If macOS still says the app is damaged, run the `xattr` line again, or check
            **System Settings → Privacy & Security** for an **Open Anyway** button.

            ## Calls
            Allow **Camera** and **Microphone** for Presence under
            **System Settings → Privacy & Security**.

            In the app: **Settings → Can't open on Mac? Help** has the same commands with a Copy button.

            Online chat/calls work. Bluetooth Nearby RFCOMM is Windows/Android only.
            Web API: `https://presence-addy.fly.dev`
          files: releases/Presence-macos-universal.dmg
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
