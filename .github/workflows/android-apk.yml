name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build web + sync Capacitor
        working-directory: frontend
        run: |
          npm run build
          npx cap sync android

      - name: Assemble debug APK
        working-directory: frontend/android
        env:
          # Integer versionCode (must increase). Marketing versionName is 0.$N (beta).
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.${{ github.run_number }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PpresenceVersionCode=$VERSION_CODE \
            -PpresenceVersionName=$VERSION_NAME

      - name: Stage APK
        run: |
          mkdir -p releases
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk releases/presence-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: presence-debug-apk
          path: releases/presence-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.sha }}
          name: Presence Beta 0.${{ github.run_number }}
          body: |
            **Presence · Beta**
            versionCode: ${{ github.run_number }}
            versionName: 0.${{ github.run_number }}

            Pre-1.0 beta build. Sideload APK for Presence.

            Install on Android, then open the app — the UI loads from production
            (`https://presence-addy.fly.dev`) so web deploys apply automatically.

            The in-app updater compares `versionCode` (integer) to the installed
            APK and prompts when a newer build is available. Displayed as **0.N · Beta**.

            Rebuild this APK when native/Bluetooth or packaging changes.
          files: releases/presence-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
