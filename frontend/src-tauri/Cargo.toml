[workspace]
members = ["."]
resolver = "2"

[package]
name = "presence-desktop"
version = "0.25.0"
description = "Presence Beta desktop shell with BLE Nearby"
authors = ["Presence"]
edition = "2021"

[lib]
name = "presence_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
btleplug = "0.11"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
